name: Release

# Push a tag such as v0.1.0 to build and test, and attach the wheel and source package to a GitHub release.
# To publish to PyPI, set up a trusted publisher for this repository on pypi.org, then uncomment the last step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: python -m pytest -q
      - run: python -m build
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
      # - uses: pypa/gh-action-pypi-publish@release/v1
