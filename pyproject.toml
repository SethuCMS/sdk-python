[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sethucms"
version = "0.0.0"
description = "Python client for the SethuCMS API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []          # standard library only

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27", "beautifulsoup4>=4.12"]
# The automation package (src/sethucms_automation). The client above stays dependency-free.
automation = ["fastapi>=0.110", "uvicorn>=0.29", "beautifulsoup4>=4.12", "playwright>=1.44", "psycopg[binary]>=3.1", "anthropic>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
